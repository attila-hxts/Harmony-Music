name: Build Linux
on:
  workflow_dispatch:

jobs:
  build:
    name: Build the Linux app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libasound2-dev libayatana-appindicator3-dev

      - name: Install packages
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Pack the app
        run: tar -czf harmony-linux.tar.gz -C build/linux/x64/release bundle

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: harmony-linux.tar.gz
